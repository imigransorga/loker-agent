<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Kantor AI Loker{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">🏢 Kantor AI Loker</a>
  <nav>
    <a href="/scout">🔎 Scout</a>
    <a href="/agent/applier">📨 Applier</a>
    <a href="/agent/builder">🧾 Builder</a>
    <a href="/analyst">📊 Analyst</a>
    <a href="/agent/manager">🧑‍💼 Manager</a>
  </nav>
  {% if claude %}<span class="pill ok">Claude aktif · {{ model }}</span>
  {% else %}<span class="pill warn">Claude belum aktif (isi API key di .env)</span>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<script>
function md(el, text){ el.innerHTML = DOMPurify.sanitize(marked.parse(text || "")); }
document.querySelectorAll("[data-md]").forEach(el => md(el, el.textContent));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
